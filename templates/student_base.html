{% extends "base.html" %}
{% block content %}
<ul class="nav nav-pills mb-4">
    <li class="nav-item">
        <a class="nav-link {% if request.path == '/student' %}active{% endif %}" href="{{ url_for('student_dashboard') }}">Dashboard</a>
    </li>
    <li class="nav-item">
        <a class="nav-link {% if request.path.startswith('/student/exams') or request.path.startswith('/student/slots') %}active{% endif %}" href="{{ url_for('student_exams') }}">Examinations</a>
    </li>
    <li class="nav-item">
        <a class="nav-link {% if request.path.startswith('/student/schedule') %}active{% endif %}" href="{{ url_for('student_schedule') }}">Schedule</a>
    </li>
    <li class="nav-item">
        <a class="nav-link {% if request.path.startswith('/student/history') or request.path.startswith('/student/bookings') %}active{% endif %}" href="{{ url_for('student_history') }}">History</a>
    </li>
    <li class="nav-item">
        <a class="nav-link {% if request.path.startswith('/student/results') %}active{% endif %}" href="{{ url_for('student_results') }}">Results</a>
    </li>
    <li class="nav-item">
        <a class="nav-link {% if request.path.startswith('/student/profile') %}active{% endif %}" href="{{ url_for('student_profile') }}">Profile</a>
    </li>
</ul>
{% block student_content %}{% endblock %}
{% endblock %}
