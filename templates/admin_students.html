{% extends "admin_base.html" %}
{% block admin_content %}
<h3 class="mb-3">Students</h3>
<div class="table-responsive">
    <table class="table table-striped bg-white align-middle">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Department</th>
            </tr>
        </thead>
        <tbody>
            {% for s in students %}
            <tr>
                <td>{{ s.id }}</td>
                <td>{{ s.name }}</td>
                <td>{{ s.email }}</td>
                <td>{{ s.phone or '' }}</td>
                <td>{{ s.department or '' }}</td>
                <td><a class="btn btn-sm btn-outline-secondary" href="{{ url_for('admin_bookings', student=s.id) }}">Bookings</a></td>
            </tr>
            {% else %}
            <tr>
                <td colspan="5" class="text-center text-muted">No students yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
