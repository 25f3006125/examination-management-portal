{% extends "admin_base.html" %}
{% block admin_content %}
<div class="card" style="max-width: 500px;">
    <div class="card-body">
        <h4 class="mb-3">New Examiner</h4>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input class="form-control mb-3" type="text" name="name" placeholder="Full name" required>
            <input class="form-control mb-3" type="email" name="email" placeholder="Email" required>
            <input class="form-control mb-3" type="password" name="password" placeholder="Password" minlength="6" required>
            <input class="form-control mb-3" type="text" name="phone" placeholder="Phone">
            <input class="form-control mb-3" type="text" name="department" placeholder="Department">
            <button class="btn btn-primary">Save</button>
            <a class="btn btn-secondary" href="{{ url_for('admin_examiners') }}">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
