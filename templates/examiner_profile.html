{% extends "examiner_base.html" %}
{% block examiner_content %}
<div class="card" style="max-width: 500px;">
    <div class="card-body">
        <h4 class="mb-3">My Profile</h4>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label class="form-label" for="email">Email (cannot be changed)</label>
            <input class="form-control mb-3" type="email" id="email" value="{{ current_user.email }}" disabled>
            <label class="form-label" for="name">Full name</label>
            <input class="form-control mb-3" type="text" id="name" name="name" value="{{ current_user.name }}" required>
            <label class="form-label" for="phone">Phone</label>
            <input class="form-control mb-3" type="text" id="phone" name="phone" value="{{ current_user.phone or '' }}">
            <label class="form-label" for="department">Department</label>
            <input class="form-control mb-3" type="text" id="department" name="department" value="{{ current_user.department or '' }}">
            <button class="btn btn-primary">Save</button>
        </form>
    </div>
</div>
{% endblock %}
