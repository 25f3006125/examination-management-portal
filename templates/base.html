<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Examination Management Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navabar-dark bg-dark mb-4 px-3">
        <a class="navbar-brand" href="{{ url_for('home') }}">EMP</a>
        <div class="text-white">
            {% if current_user.is_authenticated %}
              {{ current_user.name }} ({{ current_user.role }})
              <a class="btn btn-outline-light btn-sm ms-2" href="{{ url_for('logout') }}">Logout</a>
            {% else %}
              <a class="btn btn-outline-light btn-sm" href="{{ url_for('login') }}">Login</a>
              <a class="btn btn-outline-light btn-sm" href="{{ url_for('register') }}">Register</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% for category, message in get_flashed_messages(with_categories=true) %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
