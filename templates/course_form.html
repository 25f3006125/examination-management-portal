{% extends "admin_base.html" %}
{% block admin_content %}
<div class="card" style="max-width: 600px;">
  <div class="card-body">
    <h4 class="mb-3">{% if course %}Edit Course{% else %}New Course{% endif %}</h4>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input class="form-control mb-3" type="text" name="code" placeholder="Course code (e.g. CS101)" value="{{ course.code }}" required>
      <input class="form-control mb-3" type="text" name="name" placeholder="Course name" value="{{ course.name }}" required>
      <textarea class="form-control mb-3" name="description" placeholder="Description" rows="3">{{ course.description or '' }}</textarea>
      <select class="form-select mb-3" name="status">
        <option value="Active" {% if course.status != 'Inactive' %}selected{% endif %}>Active</option>
        <option value="Inactive" {% if course.status == 'Inactive' %}selected{% endif %}>Inactive</option>
      </select>
      <button class="btn btn-primary">Save</button>
      <a class="btn btn-secondary" href="{{ url_for('admin_courses') }}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
