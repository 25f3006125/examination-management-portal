{% extends "base.html" %}
{% block content %}
<div class="card mx-auto" style="max-width: 500px;">
    <div class="card-body">
        <h4 class="mb-3">Register</h4>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input class="form-control mb-3" type="text" name="name" placeholder="Full name" required>
            <input class="form-control mb-3" type="email" name="email" placeholder="Email" required>
            <input class="form-control mb-3" type="password" name="password" placeholder="Password" minlength="6" required>
            <input class="form-control mb-3" type="text" name="phone" placeholder="Phone">
            <input class="form-control mb-3" type="text" name="department" placeholder="Department">

            <label class="me-3"><input type="radio" name="role" value="student" checked> Student</label>
            <label><input type="radio" name="role" value="examiner"> Examiner</label>

            <button class="btn btn-primary w-100 mt-3">Register</button>
        </form>
        <p class="mt-3 mb-0">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
    </div>
</div>
{% endblock %}
