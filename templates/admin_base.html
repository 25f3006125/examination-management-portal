{% extends "base.html" %}
{% block content %}
<ul class="nav nav-pills mb-4">
    <li class="nav-item">
        <a class="nav-link {% if request.path == '/admin' %}active{% endif %}" href="{{ url_for('admin_dashboard') }}">Dashboard</a>
    </li>
    <li class="nav-item">
        <a class="nav-link {% if request.path.startswith('/admin/courses') %}active{% endif %}" href="{{ url_for('admin_courses') }}">Courses</a>
    </li>
    <li>
        <a class="nav-link {% if request.path.startswith('/admin/exams') %}active{% endif %}" href="{{ url_for('admin_exams') }}">Examinations</a>
    </li>
    <li class="nav-item">
        <a class="nav-link {% if request.path.startswith('/admin/examiners') %}active{% endif %}" href="{{ url_for('admin_examiners') }}">Examiners</a>
    </li>
    <li class="nav-item">
        <a class="nav-link {% if request.path.startswith('/admin/students') %}active{% endif %}" href="{{ url_for('admin_students') }}">Students</a>
    </li>
    <li class="nav-item">
        <a class="nav-link {% if request.path.startswith('/admin/slots') %}active{% endif %}" href="{{ url_for('admin_slots') }}">Slots</a>
    </li>
    <li class="nav-item">
        <a class="nav-link {% if request.path.startswith('/admin/bookings') %}active{% endif %}" href="{{ url_for('admin_bookings') }}">Bookings</a>
    </li>
</ul>
<form class="d-flex mb-4" method="get" action="{{ url_for('admin_search') }}" style="max-width: 480px;">
    <input class="form-control me-2" type="search" name="q" placeholder="Search students, examiners, exams, bookings (name or ID)" value="{{ request.args.get('q', '') }}">
    <button class="btn btn-outline-primary">Search</button>
</form>
{% block admin_content %}{% endblock %}
{% endblock %}
