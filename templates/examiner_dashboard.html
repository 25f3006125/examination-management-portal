{% extends "examiner_base.html" %}
{% block examiner_content %}
<h3 class="mb-3">Examiner Dashboard</h3>
<div class="row g-3">
    {% for label, value, link in stats %}
    <div class="col-6 col-md-3">
        <div class="card text-center shadow-sm">
            <div class="card-body">
                <div class="display-6">{{ value }}</div>
                <div class="text-muted">{{ label }}</div>
                <a href="{{ link }}" class="stretched-link"></a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
<p class="text-muted mt-4">Open <strong>Examinations</strong> to create slots while slot creation is open, and <strong>Students</strong> to evaluate booked students.</p>
{% endblock %}
